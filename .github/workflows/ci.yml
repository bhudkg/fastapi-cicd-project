
name: FastAPI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -----------------------------------------
  # JOB 1: TEST AND QUALITY CHECKS
  # -----------------------------------------
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fastapi_db
          POSTGRES_USER: fastapi_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastapi_user -d fastapi_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://fastapi_user:ci_test_password@localhost:5432/fastapi_db

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check app tests

      - name: Run Bandit security scan
        run: bandit -r app

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run pytest
        run: python -m pytest -v

  # -----------------------------------------
  # JOB 2: BUILD AND PUBLISH DOCKER IMAGE
  # -----------------------------------------
  publish-image:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------
  # JOB 3: DEPLOY TO MACBOOK
  # -----------------------------------------
  deploy-local:
    name: Deploy to MacBook
    runs-on: self-hosted
    needs: publish-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_ENV_FILE: /Users/deepakgangwar/cicdApp/.env
      GHCR_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker
        run: docker info

      - name: Pull latest application image
        run: docker compose --env-file "$DEPLOY_ENV_FILE" pull api

      - name: Deploy application
        run: docker compose --env-file "$DEPLOY_ENV_FILE" up -d --no-build --remove-orphans

      - name: Verify deployment
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:8000/health/ready; then
              echo "Deployment successful!"
              exit 0
            fi

            sleep 5
          done

          echo "Deployment health check failed"
          docker compose --env-file "$DEPLOY_ENV_FILE" logs api
          exit 1
